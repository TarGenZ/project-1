[build]
  command = "npm run build"
  publish = "dist"

# react-router-dom handles routing client-side, so every path needs to
# actually load index.html and let the router take over — otherwise a
# direct link or refresh on e.g. /dashboard 404s before React ever mounts.
# Vercel did this automatically via its Vite framework preset; Netlify
# needs it declared explicitly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
